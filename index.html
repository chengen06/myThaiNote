<html lang="zh-Hant">

<title>myThaiNote</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--soft:#efeae2;--tx:#1f1d1a;--tx2:#6b665e;--tx3:#a19b91;--line:#e4ded4;--ac:#c2410c;--acbg:#fdeee4;--ok:#15803d;--bad:#b91c1c;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#141311;--card:#1f1d1a;--soft:#2a2724;--tx:#f2efe9;--tx2:#aaa398;--tx3:#6f6a62;--line:#34302b;--ac:#fb923c;--acbg:#3a2417;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 32px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;min-height:52px;margin:0 -16px 8px;padding:calc(env(safe-area-inset-top)) 16px 0}
header h1{font-size:20px;margin:0;flex:1;font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:40px;min-width:40px;padding:0 12px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.ic{border:0;background:none;font-size:20px;padding:0 6px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:6px 10px;width:100%}
textarea{resize:vertical;line-height:1.5}
a{color:var(--ac)}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line)}
.sorting .card>:not(.ch){display:none}
.sorting .card .ch{margin:0}
.card.drag{position:relative;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:.95}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ch h3{margin:0;font-size:17px;flex:1;font-weight:600}
.ch input{font-weight:600}
.cnt{font-size:13px;color:var(--tx2)}
.grip{touch-action:none;border:0;background:none;color:var(--tx3);font-size:20px;min-width:44px;margin-right:-10px;letter-spacing:-3px;cursor:grab}
.it{display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer;user-select:none;-webkit-user-select:none}
.it+.it{border-top:1px solid var(--soft)}
.lv1{padding-left:26px}.lv2{padding-left:52px}
.bx{flex:none;width:22px;height:22px;border:2px solid var(--tx3);border-radius:6px;margin-top:1px;display:grid;place-items:center;color:#fff;font-size:14px}
.on .bx{background:var(--ac);border-color:var(--ac)}
.on .t{color:var(--tx3);text-decoration:line-through}
.t{flex:1;min-width:0;overflow-wrap:anywhere}
.amt{color:var(--tx2);font-size:14px;white-space:nowrap}
.it.ed{cursor:auto;align-items:center}
.it.ed input{flex:1}
.it.ed button{min-width:36px;padding:0 6px}
.add{margin-top:6px}
.add input{border-style:dashed;background:none}
.nt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.mu{color:var(--tx2);font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:block;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:96px}
.tile b{display:block;font-size:17px;margin-top:4px}
.today{background:var(--acbg);border-color:transparent}
.today .k{color:var(--ac);font-size:14px;font-weight:600}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.bar:last-child{margin-bottom:0}
.bar i{display:block;height:100%;border-radius:4px}
.rw{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:14px}
.big{font-size:24px;font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:34px}
.seg .sel{background:var(--ac);color:#fff}
.exp{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--soft)}
.exp .t small{color:var(--tx2)}
.err{color:var(--bad);font-size:13px;min-height:0}
.edbar{display:flex;gap:8px;margin:4px 0 16px}
.edbar button{flex:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>

];

const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const pad = n => String(n).padStart(2, '0');
const today = () => { if (window.TODAY) return window.TODAY; const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const toTWD = (a, cur, rate) => cur === 'TWD' ? a : a / rate;
const linkify = s => s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<]+)|(\+\d[\d ()-]{6,}\d)/g,
  (m, t, u, u2, ph) => ph ? `<a href="tel:${ph.replace('(0)', '').replace(/[^\d+]/g, '')}">${ph}</a>`
                         : `<a href="${u || u2}" target="_blank" rel="noopener">${t || u2}</a>`);

function build(seed) {
  const pages = {};
  for (const k in seed) pages[k] = seed[k].map(([type, t, body, o = {}]) => {
    const c = {id: uid(), type, t, date: o.date};
    if (type === 'list') c.items = body.split('\n').filter(l => l.trim()).map(l => {
      const [text, a] = l.trim().split('|');
      return {id: uid(), t: text, lv: Math.min(2, (l.match(/^ */)[0].length / 2) | 0), d: !!o.done, b: false, a: a ? +a : undefined};
    });
    else c.text = body;
    return c;
  });
  return pages;
}
// lb = 當地預算、tb = 全部預算；舊資料與舊備份沒有這兩欄，讀進來時補預設值
const withBudget = j => ({lb: 20000, tb: 50000, ...j});
const fresh = () => withBudget({v: 1, rate: 1.05, mode: 'go', pages: build(SEED), exp: []});
const isBudget = b => b === undefined || (typeof b === 'number' && b > 0);
// 匯入檔與本機資料都從這裡進來：id 只准英數、日期固定格式，才能直接放進 HTML 屬性
const ID = /^\w*$/, DAY = /^\d{4}-\d{2}-\d{2}$/;
const valid = j => !!j && j.v === 1 && typeof j.rate === 'number' && j.rate > 0 && isBudget(j.lb) && isBudget(j.tb)
  && Array.isArray(j.exp) && j.exp.every(e => e && ID.test(e.id) && DAY.test(e.date) && typeof e.amt === 'number')
  && !!j.pages && PAGES.every(([k]) => Array.isArray(j.pages[k]) && j.pages[k].every(c =>
       c && ID.test(c.id) && (c.type !== 'list' || (Array.isArray(c.items) && c.items.every(i => i && ID.test(i.id))))));
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return fresh();
    try { const j = JSON.parse(raw); if (valid(j)) return withBudget(j); } catch (e) {}
    localStorage.setItem(KEY + '.bad', raw); // 不合格的舊資料先另存，避免下次儲存時被蓋掉
  } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('無法儲存，請到設定匯出備份'); } }

let S = load(), cur = '', editing = false;
const $ = s => document.querySelector(s);
const app = $('#app');
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }

// ---- 計算 ----
const doneKey = page => page === 'pack' && S.mode === 'back' ? 'b' : 'd';
function progress(page) {
  let d = 0, n = 0; const k = doneKey(page);
  for (const c of S.pages[page] || []) if (c.items) for (const it of c.items) { n++; if (it[k]) d++; }
  return [d, n];
}
const expTWD = list => list.reduce((s, e) => s + toTWD(e.amt, e.cur, S.rate), 0);
const prepaid = () => S.pages.budget.reduce((s, c) => s + (c.items || []).reduce((x, it) => x + (it.d && it.a ? it.a : 0), 0), 0);

// ---- 畫面 ----
function header(title, right = '') {
  const back = cur ? `<button class="ic" data-act="back" aria-label="返回">‹</button>` : '';
  return `<header>${back}<h1>${title}</h1>${right}</header>`;
}

function itemHTML(it, k) {
  const lv = it.lv ? ` lv${it.lv}` : '';
  const amt = it.a ? `<span class="amt">NT$${fmt(it.a)}</span>` : '';
  if (editing) return `<div class="it ed${lv}" data-iid="${it.id}"><input data-f="item" value="${esc(it.t)}"><button data-act="indent" aria-label="縮排">⇥</button><button data-act="delitem" aria-label="刪除">✕</button></div>`;
  return `<div class="it${lv}${it[k] ? ' on' : ''}" data-act="chk" data-iid="${it.id}" role="checkbox" aria-checked="${!!it[k]}" tabindex="0"><span class="bx">${it[k] ? '✓' : ''}</span><span class="t">${linkify(esc(it.t))}</span>${amt}</div>`;
}

function expHTML() {
  if (!S.exp.length) return `<p class="mu">還沒有紀錄，從上方新增第一筆。</p>`;
  const days = {};
  for (const e of S.exp) (days[e.date] = days[e.date] || []).push(e);
  return Object.keys(days).sort().reverse().map(d => `<div class="row" style="justify-content:space-between;margin-top:8px"><b>${d.slice(5).replace('-', '/')}</b><span class="mu">NT$${fmt(expTWD(days[d]))}</span></div>` +
    days[d].map(e => `<div class="exp" data-eid="${e.id}"><span class="t">${esc(e.cat)}${e.note ? ' · ' + esc(e.note) : ''}<br><small>${e.cur === 'THB' ? '฿' : 'NT$'}${fmt(e.amt)}${e.cur === 'THB' ? ` ≈ NT$${fmt(toTWD(e.amt, 'THB', S.rate))}` : ''}</small></span><button class="ic" data-act="delexp" aria-label="刪除這筆">✕</button></div>`).join('')).join('');
}

function cardHTML(c, page) {
  const k = doneKey(page);
  const cnt = c.items ? `<span class="cnt">${c.items.filter(i => i[k]).length}/${c.items.length}</span>` : '';
  const title = editing ? `<input data-f="title" value="${esc(c.t)}">` : `<h3>${esc(c.t)}</h3>`;
  let body = '';
  if (c.type === 'list') body = c.items.map(it => itemHTML(it, k)).join('') +
    `<form class="add" data-act="additem"><input name="t" placeholder="＋ 新增項目" enterkeyhint="done" autocomplete="off"></form>`;
  else if (c.type === 'note') body = editing
    ? `<textarea data-f="note" rows="${c.text.split('\n').length + 1}">${esc(c.text)}</textarea>`
    : `<div class="nt">${linkify(esc(c.text)) || '<span class="mu">（空白，點右上 ✎ 編輯）</span>'}</div>`;
  else if (c.type === 'exp') body = expHTML();
  const tools = editing && c.type !== 'exp' ? `<button class="ic" data-act="delcard" aria-label="刪除卡片">🗑</button>`
    : c.type === 'note' && c.text ? `<button class="ic" data-act="copy" aria-label="複製內容">⧉</button>` : '';
  return `<section class="card" data-cid="${c.id}"><div class="ch">${title}${cnt}${tools}<button class="grip" aria-label="拖曳排序">⋮⋮</button></div>${body}</section>`;
}

function homeHTML() {
  const t = today(), md = t.slice(5).replace('-', '/');
  const day = S.pages.itin.find(c => c.date === t);
  const todo = S.pages.todo.find(c => c.date === t);
  const spent = expTWD(S.exp.filter(e => e.date === t));
  let head;
  if (day) head = `<div class="k">今天 ${md} · ${esc(day.t.split(' · ')[0])}</div><div style="font-weight:600">${linkify(esc(day.text))}</div>`;
  else if (t < TRIP[0]) head = `<div class="k">今天 ${md} · 出發倒數 ${Math.round((new Date(TRIP[0]) - new Date(t)) / 864e5)} 天</div><div style="font-weight:600">10/24 傍晚抵達 BKK</div>`;
  else head = `<div class="k">今天 ${md}</div><div style="font-weight:600">旅程結束，歡迎回家 · <a href="#/home">旅途賦歸</a></div>`;
  const left = todo ? todo.items.filter(i => !i.d) : [];
  const todoHTML = todo ? `<div class="mu" style="margin-top:6px">待辦 ${todo.items.length - left.length}/${todo.items.length}${left.length ? '：' + left.slice(0, 4).map(i => esc(i.t)).join('、') + (left.length > 4 ? '…' : '') : ' 全部完成'}</div>` : '';
  const tiles = PAGES.map(([k, ic, name]) => {
    const [d, n] = progress(k);
    const sub = k === 'budget' ? `旅途 NT$${fmt(expTWD(S.exp))}` : k === 'itin' ? 'D1–D8' : k === 'info' ? '機場 · PIR · VAT' : k === 'note' ? '小筆 · 連結' : `${d}/${n}`;
    return `<a class="tile" href="#/${k}"><span style="font-size:24px">${ic}</span><b>${name}</b><span class="mu">${sub}</span></a>`;
  }).join('');
  return header('myThaiNote', `<button class="ic" data-act="go" data-to="settings" aria-label="設定">⚙</button>`) +
    `<a class="card today" href="#/${day ? 'itin' : 'todo'}" style="display:block;text-decoration:none;color:inherit">${head}${todoHTML}<div class="mu" style="margin-top:4px">今日花費 NT$${fmt(spent)}</div></a><div class="grid">${tiles}</div>`;
}

const barColor = p => p > 100 ? '#9333ea' : p >= 80 ? '#dc2626' : p >= 60 ? '#f97316' : '#16a34a';
function budgetTop() {
  const trip = expTWD(S.exp), all = prepaid() + trip, left = S.lb - trip;
  const row = (name, v, max) => {
    const p = v / max * 100;
    return `<div class="rw"><span>${name} <b>NT$${fmt(v)}</b></span><span class="mu">${v > max ? `超支 NT$${fmt(v - max)}` : `${fmt(v)} / ${fmt(max)}`} · ${Math.round(p)}%</span></div>
    <div class="bar"><i style="width:${Math.min(100, p)}%;background:${barColor(p)}"></i></div>`;
  };
  return `<div class="card"><div class="mu">旅途預算</div>
  <div class="row" style="align-items:baseline"><span class="mu">${left < 0 ? '已超支' : '可花費'}</span><span class="big"${left < 0 ? ' style="color:#9333ea"' : ''}>NT$${fmt(Math.abs(left))}</span></div>
  <div class="mu" style="margin-bottom:8px">≈ ฿${fmt(Math.abs(left) * S.rate)} · 1 TWD = ${S.rate} THB</div>
  ${row('當地花費', trip, S.lb)}${row('所有花費', all, S.tb)}</div>
  <form class="card" data-act="addexp">
   <div class="row"><input name="amt" type="number" inputmode="decimal" step="any" min="0" placeholder="金額" style="flex:1.3"><select name="cur" style="flex:1"><option>THB</option><option>TWD</option></select><select name="cat" style="flex:1">${CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
   <div class="row" style="margin-top:8px"><input name="note" placeholder="船麵 x2" style="flex:2"><input name="date" type="date" value="${today()}" style="flex:1.4"></div>
   <div class="err" id="experr"></div>
   <div class="row" style="margin-top:8px"><span class="mu" style="flex:1">1 TWD = ${S.rate} THB <a href="#/settings">調整</a></span><button class="pri">新增</button></div>
  </form>`;
}

function pageHTML(page) {
  const meta = PAGES.find(p => p[0] === page);
  const right = (page === 'pack' ? `<div class="seg"><button data-act="mode" data-m="go" class="${S.mode === 'go' ? 'sel' : ''}">去程</button><button data-act="mode" data-m="back" class="${S.mode === 'back' ? 'sel' : ''}">回程</button></div>` : '') +
    `<button class="ic" data-act="edit" aria-label="${editing ? '完成編輯' : '編輯'}">${editing ? '✓' : '✎'}</button>`;
  const addBar = editing ? `<div class="edbar"><button data-act="addcard" data-type="list">＋ 清單卡</button><button data-act="addcard" data-type="note">＋ 筆記卡</button></div>` : '';
  return header(meta[2], right) + (page === 'budget' ? budgetTop() : '') +
    `<div class="cards">${S.pages[page].map(c => cardHTML(c, page)).join('')}</div>${addBar}`;
}

function settingsHTML() {
  const field = (label, id, val, unit, mode) => `<div class="row" style="margin-top:8px"><span style="width:84px">${label}</span><input id="${id}" type="number" inputmode="${mode}" step="any" min="0" value="${val}" style="flex:1"><span>${unit}</span></div>`;
  return header('設定') + `<div class="card"><h3 style="margin:0">匯率與預算</h3>${field('1 TWD =', 'rate', S.rate, 'THB', 'decimal')}${field('當地預算', 'lb', S.lb, 'NT$', 'numeric')}${field('全部預算', 'tb', S.tb, 'NT$', 'numeric')}
  <p class="mu">換匯後填入實際匯率，所有 THB 花費會依此換算。全部預算包含已購行程與當地花費。</p></div>
  <div class="card"><h3 style="margin:0 0 8px">備份</h3><p class="mu" style="margin-top:0">資料只存在這支手機。iOS 可能清除長期沒開的網站資料，建議定期匯出。</p>
  <div class="row"><button data-act="export" style="flex:1">匯出 JSON</button><label style="flex:1"><input id="imp" type="file" accept="application/json,.json" hidden><span style="display:flex;align-items:center;justify-content:center;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card)">匯入 JSON</span></label></div></div>
  <div class="card"><h3 style="margin:0 0 8px">重置</h3><p class="mu" style="margin-top:0">清除所有勾選、紀錄和編輯，回到原始內容。</p><button data-act="reset" style="color:var(--bad)">重置為預設</button></div>`;
}

function render() {
  const m = location.hash.match(/^#\/(\w+)/);
  const page = m && (S.pages[m[1]] || m[1] === 'settings') ? m[1] : '';
  if (page !== cur) { editing = false; cur = page; window.scrollTo(0, 0); }
  app.style.transition = 'none'; app.style.transform = ''; // 右滑返回後歸位
  app.innerHTML = !cur ? homeHTML() : cur === 'settings' ? settingsHTML() : pageHTML(cur);
}

// ---- 事件 ----
const cardOf = el => S.pages[cur].find(c => c.id === el.closest('[data-cid]').dataset.cid);
const itemOf = el => cardOf(el).items.find(i => i.id === el.closest('[data-iid]').dataset.iid);
const goBack = () => { history.length > 1 ? history.back() : location.hash = ''; };

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || e.target.closest('a') || el.tagName === 'FORM') return;
  const act = el.dataset.act;
  if (act === 'back') { goBack(); return; }
  if (act === 'go') { location.hash = '#/' + el.dataset.to; return; }
  if (act === 'chk') { const it = itemOf(el), k = doneKey(cur); it[k] = !it[k]; }
  else if (act === 'edit') { editing = !editing; }
  else if (act === 'mode') { S.mode = el.dataset.m; }
  else if (act === 'indent') { const it = itemOf(el); it.lv = ((it.lv || 0) + 1) % 3; }
  else if (act === 'delitem') { const c = cardOf(el), it = itemOf(el); c.items.splice(c.items.indexOf(it), 1); }
  else if (act === 'delcard') { const c = cardOf(el); if (!confirm(`刪除「${c.t}」整張卡片？`)) return; S.pages[cur].splice(S.pages[cur].indexOf(c), 1); }
  else if (act === 'addcard') { const type = el.dataset.type; S.pages[cur].push(type === 'list' ? {id: uid(), type, t: '新清單', items: []} : {id: uid(), type, t: '新筆記', text: ''}); }
  else if (act === 'delexp') { const id = el.closest('[data-eid]').dataset.eid; if (!confirm('刪除這筆花費？')) return; S.exp = S.exp.filter(x => x.id !== id); }
  else if (act === 'copy') { const t = cardOf(el).text; navigator.clipboard ? navigator.clipboard.writeText(t).then(() => toast('已複製'), () => toast('無法複製')) : toast('無法複製'); return; }
  else if (act === 'export') { exportJSON(); return; }
  else if (act === 'reset') { if (!confirm('確定清除所有紀錄並回到預設內容？建議先匯出備份。')) return; S = fresh(); toast('已重置'); }
  else return;
  save(); render();
});
app.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && e.target.dataset.act === 'chk') { e.preventDefault(); e.target.click(); } });

app.addEventListener('input', e => {
  const f = e.target.dataset.f;
  if (f === 'title') cardOf(e.target).t = e.target.value;
  else if (f === 'item') itemOf(e.target).t = e.target.value;
  else if (f === 'note') cardOf(e.target).text = e.target.value;
  else if (['rate', 'lb', 'tb'].includes(e.target.id)) { const r = parseFloat(e.target.value); if (!(r > 0)) return; S[e.target.id] = r; }
  else return;
  save();
});

app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.act === 'additem') {
    const t = f.t.value.trim(); if (!t) return;
    const c = cardOf(f); c.items.push({id: uid(), t, lv: 0, d: false, b: false});
    save(); render(); const inp = app.querySelector(`[data-cid="${c.id}"] .add input`); if (inp) inp.focus();
  } else if (f.dataset.act === 'addexp') {
    const amt = parseFloat(f.amt.value);
    if (!(amt > 0)) { $('#experr').textContent = '請輸入大於 0 的金額'; f.amt.focus(); return; }
    S.exp.push({id: uid(), date: f.date.value || today(), amt, cur: f.cur.value, cat: f.cat.value, note: f.note.value.trim()});
    save(); render(); toast(`已記錄 ${f.cur.value === 'THB' ? '฿' : 'NT$'}${fmt(amt)}`);
  }
});

app.addEventListener('change', e => {
  if (e.target.id !== 'imp' || !e.target.files[0]) return;
  e.target.files[0].text().then(txt => {
    const j = JSON.parse(txt);
    if (!valid(j)) throw new Error('bad');
    if (!confirm('匯入會覆蓋目前所有資料，確定？')) return;
    S = withBudget(j); save(); toast('已匯入'); render();
  }).catch(() => toast('這不是 myThaiNote 的備份檔'));
});

function exportJSON() {
  const name = `myThaiNote-${today()}.json`;
  const blob = new Blob([JSON.stringify(S)], {type: 'application/json'});
  const file = new File([blob], name, {type: 'application/json'});
  if (navigator.canShare && navigator.canShare({files: [file]})) { navigator.share({files: [file]}).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---- 拖曳排序：只有把手會觸發，頁面捲動不受影響 ----
app.addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip'); if (!grip) return;
  e.preventDefault();
  const card = grip.closest('.card'), list = card.parentNode;
  try { grip.setPointerCapture(e.pointerId); } catch (x) {}
  list.classList.add('sorting'); // 收合成只剩標題，長卡片才拖得過去
  card.classList.add('drag');
  const off = card.offsetHeight / 2;
  card.style.transform = `translateY(${e.clientY - off - card.getBoundingClientRect().top}px)`;
  const move = ev => {
    const y = ev.clientY;
    const next = [...list.children].find(s => s !== card && y < s.getBoundingClientRect().top + s.offsetHeight / 2);
    if (next) { if (card.nextElementSibling !== next) list.insertBefore(card, next); }
    else if (list.lastElementChild !== card) list.appendChild(card);
    if (y < 70) window.scrollBy(0, -14); else if (y > innerHeight - 70) window.scrollBy(0, 14);
    card.style.transform = '';
    card.style.transform = `translateY(${y - off - card.getBoundingClientRect().top}px)`;
  };
  const up = () => {
    grip.removeEventListener('pointermove', move);
    grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
    card.classList.remove('drag'); card.style.transform = ''; list.classList.remove('sorting');
    card.scrollIntoView({block: 'nearest'});
    const order = [...list.children].map(x => x.dataset.cid);
    S.pages[cur].sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    save();
  };
  grip.addEventListener('pointermove', move);
  grip.addEventListener('pointerup', up, {once: true});
  grip.addEventListener('pointercancel', up, {once: true});
});

// ---- 左緣右滑返回：只在主畫面 App 啟用，Safari 分頁本身已有返回手勢，兩個都觸發會退兩頁 ----
let swipe = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0], standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  swipe = cur && standalone && e.touches.length === 1 && t.clientX <= 30 ? {x: t.clientX, y: t.clientY, dx: 0, on: false} : null;
}, {passive: true});
document.addEventListener('touchmove', e => {
  if (!swipe) return;
  const t = e.touches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  if (!swipe.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > dx) { swipe = null; return; } // 偏上下移動就當作捲動
    if (dx < 10) return;
    swipe.on = true; app.style.transition = 'none';
  }
  e.preventDefault();
  swipe.dx = Math.max(0, dx); app.style.transform = `translateX(${swipe.dx}px)`;
}, {passive: false});
const swipeEnd = () => {
  if (!swipe || !swipe.on) { swipe = null; return; }
  const done = swipe.dx > innerWidth / 3; swipe = null;
  app.style.transition = 'transform .2s ease-out';
  app.style.transform = done ? `translateX(${innerWidth}px)` : '';
  if (done) setTimeout(goBack, 200);
};
document.addEventListener('touchend', swipeEnd);
document.addEventListener('touchcancel', () => { if (swipe) swipe.dx = 0; swipeEnd(); });

window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); }); // App 隔夜從背景回來時更新「今天」
render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---- 金額計算自我檢查：網址加 ?test 時執行 ----
function selfTest() {
  console.assert(Math.abs(toTWD(320, 'THB', 1.05) - 304.7619) < 1e-3, 'THB→TWD');
  console.assert(toTWD(100, 'TWD', 1.05) === 100, 'TWD 不換算');
  const f = build(SEED);
  const known = f.budget.find(c => c.t === '已知花費').items.reduce((s, i) => s + (i.d ? i.a : 0), 0);
  console.assert(known === 29533, '已知花費總和 ' + known);
  const pot = f.budget.find(c => c.t.startsWith('潛在')).items;
  console.assert(pot.every(i => !i.d) && pot.reduce((s, i) => s + i.a, 0) === 5808, '潛在花費');
  console.assert(f.pack.find(c => c.t === '隨身行李').items[2].lv === 2, '巢狀縮排');
  console.assert(linkify('+66 (0) 2217 3000').includes('tel:+6622173000'), 'tel 連結');
  const ok = fresh(); ok.exp.push({id: 'x1', date: '2026-10-26', amt: 320, cur: 'THB', cat: '餐飲', note: ''});
  const copy = () => JSON.parse(JSON.stringify(ok));
  console.assert(valid(ok) && valid(copy()), '預設資料與匯出再匯入應通過');
  const noPage = copy(); delete noPage.pages.itin;
  console.assert(!valid(noPage), '缺頁應擋下');
  const badId = copy(); badId.pages.itin[0].id = '"><img>';
  console.assert(!valid(badId), '危險 id 應擋下');
  const badDate = copy(); badDate.exp[0].date = 'abc';
  console.assert(!valid(badDate), '錯誤日期應擋下');
  const old = copy(); delete old.lb; delete old.tb;
  console.assert(valid(old) && withBudget(old).lb === 20000 && withBudget(old).tb === 50000, '舊資料補預算預設值');
  const badBudget = copy(); badBudget.lb = '"><img>';
  console.assert(!valid(badBudget), '非數字預算應擋下');
  const colors = [59.9, 60, 79.9, 80, 100, 100.1].map(barColor).join();
  console.assert(colors === '#16a34a,#f97316,#f97316,#dc2626,#dc2626,#9333ea', '進度條顏色分段 ' + colors);
  console.log('selfTest done');
  return true;
}
if (location.search.includes('test')) selfTest();
</script>
